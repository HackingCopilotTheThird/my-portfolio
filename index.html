<!DOCTYPE html>
<html lang="en">
  <meta charset="UTF-8">
  <title>Geometry Dash</title>
  <style>
    iframe {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.78vh;
            transform: translate(-50%, -50%);
            border: 0;
            pointer-events: none;
        }

        .center {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* change values later */
        a {
            background: cyan;
            color: black;
            font-size: 28px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            padding: 18px 48px;
            border: 3px solid white;
            border-radius: 12px;
            text-decoration: none;
        }
        a:hover { background: white; }
  </style>
<body>
  <iframe src="https://www.youtube.com/embed/57gRdstVKfU?autoplay=1&mute=1&controls=0&loop=1&playlist=57gRdstVKfU"></iframe>
  <div class="center">
    <a href="homepage.html">Enter</a>
  </div>
</body>
</html>
