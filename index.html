<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Dash</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: black;
    }

    .hero-section {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: sans-serif;
    }

    .video-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none; /* Prevents users from clicking/pausing the video */
      overflow: hidden;
    }

    /* Fills the entire screen cleanly without black bars */
    .video-background video {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* Optional dark overlay so the button stands out clearly */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 110%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
    }

    /* change values later */
    a {
      display: inline-block;
      background: cyan;
      color: black;
      font-size: 28px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      padding: 18px 48px;
      border: 3px solid white;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    a:hover {
      background: #00e5e5;
      transform: scale(1.05);
    }
  </style>
</head>
<body>


  <section class="hero-section">
    <div class="video-background">
      <video autoplay loop muted playsinline>
        <source src="gdbackground.mp4" type="video/mp4">
      </video>
    </div>

    <div class="overlay"></div>

    <div class="content">
      <a href="homepage.html">Enter</a>
    </div>
  </section>
<audio id="bg-music" loop hidden>
  <source src="geometrydashthememusic.mp3" type="audio/mpeg">
</audio>

<script>
  // all of this is so that every time the user goes to a new page, the music continues from where it left off instead of restarting
  const music = document.getElementById('bg-music');

  // Resume from saved position
  const saved = parseFloat(sessionStorage.getItem('musicTime')) || 0;
  music.currentTime = saved;

  // Save position constantly and right before leaving the page
  setInterval(() => sessionStorage.setItem('musicTime', music.currentTime), 250);
  window.addEventListener('beforeunload', () => {
    sessionStorage.setItem('musicTime', music.currentTime);
  });

  // tries to play the music, if the browser auto blocks it, when the user interacts with the website, it will play the music
  music.play().catch(() => {
    document.addEventListener('click', () => music.play(), { once: true });
  });
</script>
</body>
</html>
